version: 2.1

jobs:
  check:
    docker:
      - image: cimg/python:3.12
    resource_class: small
    steps:
      - checkout
      - run:
          name: Byte-compile plugin sources
          command: python -m compileall -q -f __init__.py libgen_plugin.py

workflows:
  ci:
    jobs:
      - check
