---
# Vendored tooling, not project code:
#   .nx/**           - wrapper generated by `nx init`
#   .agent/**        - Sepo agent backend installed from a pinned release
#   .github/actions/** - Sepo-shipped composite action scripts
# These are refreshed by the agent-update workflow, so they are excluded from analysis.
exclude_paths:
  - ".nx/**"
  - ".agent/**"
  - ".github/actions/**"
